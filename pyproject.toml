[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsecal"
version = "1.0.0"
description = "Pulse-level calibration of a single-qubit gate on a weakly anharmonic transmon"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "S.M. Yousuf Iqbal Tomal" }]
keywords = ["quantum control", "transmon", "DRAG", "GRAPE", "qiskit-pulse"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "qiskit>=0.46",
    "qiskit-dynamics>=0.5",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
